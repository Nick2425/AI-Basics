<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="NeuroSoma - Interactive anatomy study companion with 3D viewport and knowledge gap detection for biomedical coursework">
    <title>NeuroSoma - Anatomy Study Navigator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="app">
        <!-- ==================== Header & Menu Bar ==================== -->
        <header id="header">
            <div class="header-left">
                <h1 class="app-title">NeuroSoma</h1>
                <nav class="menu-bar" aria-label="Application menu">
                    <div class="menu-item" id="menu-view">
                        <button class="menu-button" aria-haspopup="true" aria-expanded="false">View</button>
                        <div class="dropdown" id="dropdown-view" role="menu">
                            <div class="dropdown-section">
                                <div class="dropdown-label">Layers</div>
                                <label class="dropdown-checkbox">
                                    <input type="checkbox" id="layer-nervous" checked>
                                    <span>Nervous System</span>
                                </label>
                                <label class="dropdown-checkbox">
                                    <input type="checkbox" id="layer-musculoskeletal" checked>
                                    <span>Musculoskeletal System</span>
                                </label>
                            </div>
                        </div>
                    </div>
                </nav>
            </div>
            <div class="header-right">
                <div class="theme-switcher" id="theme-switcher">
                    <!-- Theme controls wired in a later slice -->
                </div>
            </div>
        </header>

        <!-- ==================== 3-Column Workspace ==================== -->
        <main id="workspace">
            <!-- Left Panel: Study Notes Tree -->
            <aside id="left-panel" class="panel">
                <div class="panel-header">
                    <span class="panel-title">Study Notes</span>
                </div>
                <div class="panel-content" id="notes-tree">
                    <div class="empty-state" id="notes-empty-state">
                        <p>Click a structure to begin annotating</p>
                    </div>
                </div>
            </aside>

            <!-- Center: Anatomical Viewport -->
            <section id="viewport-section">
                <div id="viewport-container"></div>
            </section>

            <!-- Right Panel: Terminal Console -->
            <aside id="right-panel" class="panel">
                <div class="panel-header">
                    <span class="panel-title">Terminal</span>
                </div>
                <div class="panel-content" id="terminal-container">
                    <div class="empty-state">
                        <p class="terminal-placeholder">Terminal initializing...</p>
                    </div>
                </div>
            </aside>
        </main>
    </div>

    <!-- Three.js r128 via CDN (global build) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- Application Scripts -->
    <script src="/js/viewport.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
